services:
  webserver:
    image: mfandrade/stackio-webserver:latest
    build:
      context: .
      dockerfile: Dockerfile.webserver
    ports:
      - 8080:8080
    secrets:
      - mariadb-password
    depends_on:
      - backend
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8080",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 3s

  backend:
    image: mfandrade/stackio-backend:latest
    build:
      context: .
      dockerfile: Dockerfile.backend
    environment:
      - MARIADB_PASSWORD_FILE=/run/secrets/mariadb-password
    secrets:
      - mariadb-password
    ports:
      - 3306:3306
    healthcheck:
      test: ["CMD", "mysqladmin", "-f", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 3s

secrets:
  mariadb-password:
    file: ./database.pw
