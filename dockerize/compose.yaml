services:
  webserver:
    image: mfandrade/stackio-webserver:latest
    build:
      context: .
      dockerfile: Dockerfile
    env_file: .env
    ports:
      - 8080:8080
    depends_on:
      - backend
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:8080",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 3s

  backend:
    image: mariadb:11
    environment:
      - MARIADB_RANDOM_ROOT_PASSWORD=true
      - MARIADB_DATABASE=db
      - MARIADB_USER=dbuser
    env_file: .env
    ports:
      - 3306:3306
    healthcheck:
      test: ["CMD", "mysqladmin", "-f", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 3s
