---
apiVersion: v1
kind: Namespace
metadata:
  creationTimestamp: null
  name: stackio
spec: {}
status: {}
---
apiVersion: v1
kind: Secret
metadata:
  creationTimestamp: null
  name: credentials
  namespace: stackio
data:
  MARIADB_PASSWORD: UEA1NXcwcmQh
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: stackio-backend
  namespace: stackio
  creationTimestamp: null
  labels:
    app: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      namespace: stackio
      creationTimestamp: null
      labels:
        app: backend
    spec:
      containers:
        - image: mfandrade/stackio-backend:latest
          imagePullPolicy: Always
          name: stackio-backend
          ports:
            - containerPort: 3306
          resources: {}
          volumeMounts:
            - name: credentials-volume
              mountPath: /mnt/credentials-volume
              readOnly: true
          env:
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credentials
                  key: MARIADB_PASSWORD
      volumes:
        - name: credentials-volume
          secret:
            secretName: credentials
status: {}

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: stackio
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - port: 3306
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stackio-webserver
  namespace: stackio
  creationTimestamp: null
  labels:
    app: webserver
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webserver
  strategy: {}
  template:
    metadata:
      namespace: stackio
      creationTimestamp: null
      labels:
        app: webserver
    spec:
      containers:
        - image: mfandrade/stackio-webserver:latest
          name: webserver
          ports:
            - containerPort: 8080
          resources: {}
          env:
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: credentials
                  key: MARIADB_PASSWORD
          volumeMounts:
            - name: credentials-volume
              mountPath: /mnt/credentials-volume
              readOnly: true
      volumes:
        - name: credentials-volume
          secret:
            secretName: credentials
status: {}

---
apiVersion: v1
kind: Service
metadata:
  creationTimestamp: null
  labels:
    app: webserver
  name: webserver
spec:
  ports:
    - port: 8080
      protocol: TCP
      targetPort: 8080
  selector:
    app: webserver
  type: LoadBalancer
status:
  loadBalancer: {}
