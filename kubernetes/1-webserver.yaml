kind: Deployment
apiVersion: apps/v1
metadata:
  namespace: stackio
  labels:
    app: webserver
  name: webserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webserver
  template:
    metadata:
      labels:
        app: webserver
    spec:
      containers:
        - image: mfandrade/stackio-webserver:latest
          name: stackio-webserver
          ports:
            - containerPort: 8080
          livenessProbe:
            initialDelaySeconds: 3
            periodSeconds: 30
            httpGet:
              path: /
              port: 8080
          readinessProbe:
            initialDelaySeconds: 3
            periodSeconds: 5
            httpGet:
              path: /
              port: 8080
